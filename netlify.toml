[build]
  # LANSERINGSFAS: bara Coming Soon-sidan publiceras.
  #
  # Bygget skapar dist/ från grunden och kopierar dit enbart coming-soon.html
  # (som index.html) och robots.txt. golfbollsguiden_final.html kopieras aldrig
  # dit, så fulla sajten finns inte på internet — inte på /index.html, inte på
  # någon gissningsbar adress, inte alls. Det är skillnaden mot att dölja den
  # med en rewrite: en regel kan sluta gälla, men en fil som aldrig laddats upp
  # kan inte läcka.
  #
  # Granska fulla sajten lokalt genom att öppna golfbollsguiden_final.html
  # direkt i webbläsaren.
  #
  # VID LANSERING: byt ut command mot den bortkommenterade raden nedan.
  #   command = "rm -rf dist && mkdir -p dist && cp golfbollsguiden_final.html dist/index.html && cp robots.txt sitemap.xml og-image.svg dist/"
  command = "rm -rf dist && mkdir -p dist && cp coming-soon.html dist/index.html && cp robots.txt sitemap.xml og-image.svg dist/"
  publish = "dist"

# Ingen functions-katalog längre: bildskanningen körs helt i webbläsaren med
# Tesseract.js, så sajten är rent statisk och kostar inget per besökare.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# sitemap.xml och og-image.svg kopieras redan under lanseringsfasen. Sajten
# ligger på hash-adresser, så varje url i sitemapen svarar med den sida som
# faktiskt publiceras just nu — inga 404:or, och inget att komma ihåg att
# lägga till den dag fulla sajten går live.

[[headers]]
  for = "/index.html"
  [headers.values]
    # HTML får aldrig cachas hårt: hela sajten ligger i den här enda filen, så
    # en cachad kopia är en helt inaktuell sajt tills cachen går ut.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og-image.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
